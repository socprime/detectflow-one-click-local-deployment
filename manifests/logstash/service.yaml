apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    app: logstash
spec:
  type: NodePort
  selector:
    app: logstash
  ports:
  - { name: syslog, port: ${LOGSTASH_SYSLOG_PORT}, targetPort: ${LOGSTASH_SYSLOG_PORT}, nodePort: ${LOGSTASH_SYSLOG_NODEPORT}, protocol: TCP }
  - { name: json,   port: ${LOGSTASH_JSON_PORT},   targetPort: ${LOGSTASH_JSON_PORT},   nodePort: ${LOGSTASH_JSON_NODEPORT}, protocol: TCP }
  - { name: text,   port: ${LOGSTASH_TEXT_PORT},   targetPort: ${LOGSTASH_TEXT_PORT},   nodePort: ${LOGSTASH_TEXT_NODEPORT}, protocol: TCP }
