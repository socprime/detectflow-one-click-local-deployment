apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: external
    port: 9094
    targetPort: 9094
  - name: controller
    port: 9093
    targetPort: 9093
  selector:
    app: kafka
