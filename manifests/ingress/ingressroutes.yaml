# One Traefik IngressRoute per service. Each binds a dedicated TLS entrypoint
# (defined in the Traefik Helm values) to its backend. `tls: {}` makes it a TLS
# router using Traefik's default certificate (the df-tls TLSStore in values.yaml) -
# a per-route secretName would NOT work here because the rule has no Host, so the
# cert never enters the SNI store. Match is PathPrefix(/) because the entrypoint
# (= host port) already uniquely identifies the service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: detectflow-ui
  namespace: ${NAMESPACE}
spec:
  entryPoints:
    - uihttps
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: admin-panel-ui
          port: 4173
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: detectflow-api
  namespace: ${NAMESPACE}
spec:
  entryPoints:
    - apihttps
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: admin-panel-be
          port: 8000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: detectflow-kafka-ui
  namespace: ${NAMESPACE}
spec:
  entryPoints:
    - kafkauihttps
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: kafka-ui
          port: 8080
  tls: {}
