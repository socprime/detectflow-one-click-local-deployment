# Self-signed root CA + CA ClusterIssuer (used only when TLS_MODE=selfsigned).
# No envsubst vars here - the CA keypair lives in cert-manager's own namespace,
# which is where cert-manager reads ClusterIssuer CA secrets from by default.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: detectflow-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: detectflow-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: detectflow-ca
  secretName: detectflow-ca-keypair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: detectflow-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: detectflow-ca-issuer
spec:
  ca:
    secretName: detectflow-ca-keypair
