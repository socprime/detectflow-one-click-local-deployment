# LLM API key for the DetectFlow agent jobs. The key comes from .env via envsubst;
# it is NEVER committed. stringData takes a plain value (no base64). An empty value
# is valid when the LLM features are unused. Namespace is set by the deploy
# (`kubectl apply -n ${NAMESPACE}`), so it is intentionally omitted here.
apiVersion: v1
kind: Secret
metadata:
  name: detectflow-agent-secrets
type: Opaque
stringData:
  LLM_API_KEY: "${LLM_API_KEY}"
