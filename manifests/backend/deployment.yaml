apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel-be
  labels:
    app.kubernetes.io/name: admin-panel-be
    app.kubernetes.io/instance: admin-panel-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-panel-be
      app.kubernetes.io/instance: admin-panel-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-panel-be
        app.kubernetes.io/instance: admin-panel-be
    spec:
      serviceAccountName: default
      containers:
      - name: admin-panel-be
        image: ${IMAGE_BACKEND}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: admin-panel-be-config
        - secretRef:
            name: admin-panel-be-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
        volumeMounts:
        - name: pvc
          mountPath: /mnt/metrics
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: admin-panel-metrics-pvc
