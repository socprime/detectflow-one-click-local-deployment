apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel-ui
  labels:
    app.kubernetes.io/name: admin-panel-ui
    app.kubernetes.io/instance: admin-panel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-panel-ui
      app.kubernetes.io/instance: admin-panel-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-panel-ui
        app.kubernetes.io/instance: admin-panel-ui
    spec:
      containers:
      - name: admin-panel-ui
        image: ${IMAGE_UI}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 4173
        envFrom:
        - configMapRef:
            name: admin-panel-ui-config
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 4173
          initialDelaySeconds: 10
          periodSeconds: 5
